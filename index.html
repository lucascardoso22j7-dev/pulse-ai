<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse AI</title>
  <!-- Ícone / Favicon do site -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css?v=3.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="app-container">
    <!-- BARRA SUPERIOR -->
    <header class="app-header">
      <div class="logo-area">
        <i class="fa-solid fa-wave-square" style="color: #ff003c; font-size: 20px;"></i>
        <span>Pulse AI</span>
      </div>
      <div class="header-controls">
        <div class="color-pickers">
          <input type="color" id="color1" value="#ff003c" title="Cor 1 do Degradê">
          <input type="color" id="color2" value="#0072ff" title="Cor 2 do Degradê">
        </div>
        <button id="btnLimpar" class="btn-limpar"><i class="fa-solid fa-trash-can"></i> Limpar</button>
      </div>
    </header>

    <!-- ABA DO CHAT -->
    <div id="aba-chat" class="tab-content active">
      <div class="chat-history" id="historico">
        <!-- Boas-vindas injetadas pelo script.js -->
      </div>

      <!-- INPUT E BARRA DE ENVIO COM VOZ -->
      <div class="chat-input-area">
        <button id="btnMais" class="btn-mais"><i class="fa-solid fa-plus"></i></button>
        
        <!-- Menu Flutuante de Anexos -->
        <div id="menuAnexo" class="menu-anexo">
          <button id="btnMenuCortes"><i class="fa-solid fa-video"></i> Gerador de Cortes</button>
          <button id="btnMenuImagem"><i class="fa-solid fa-image"></i> Gerar Imagem</button>
          <label for="uploadEditarImagem" class="menu-item-label">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Editar Foto (Filtro/Efeito)
          </label>
          <input type="file" id="uploadEditarImagem" accept="image/*" style="display: none;">
          <button id="btnMenuMemes"><i class="fa-solid fa-clapperboard"></i> Estúdio de Memes</button>
        </div>

        <input type="text" id="pergunta" placeholder="Digite ou clique no microfone para falar...">
        
        <!-- Botão do Microfone para Chat por Voz -->
        <button id="btnVoz" class="btn-voz" title="Falar por voz"><i class="fa-solid fa-microphone"></i></button>
        
        <button id="btnPerguntar" class="btn-enviar"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>

    <!-- ABA DO ESTÚDIO DE MEMES -->
    <div id="aba-memes" class="tab-content">
      <div class="memes-header">
        <button id="btnVoltarChat" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar ao Chat</button>
        <h2>Estúdio de Memes & Cortes</h2>
      </div>
      <div class="memes-body">
        <div class="import-section">
          <input type="text" id="linkMemeInput" placeholder="Cole o link do TikTok ou Instagram...">
          <button id="btnImportarLink" class="btn-acao">Importar Link</button>
          <label class="btn-acao upload-label">
            📁 Enviar Vídeo <input type="file" id="novoVideoMeme" accept="video/*" style="display:none">
          </label>
        </div>

        <div class="import-section" style="margin-top: 10px;">
          <label class="btn-acao upload-label" style="background: #8e2de2;">
            📷 Carregar Foto para Edição <input type="file" id="uploadFotoMeme" accept="image/*" style="display:none">
          </label>
        </div>

        <div id="painelFotoEdicao" style="display:none; text-align:center; padding: 10px; background: #111; border-radius: 8px; margin-top: 10px;">
          <img id="imgMemePreview" style="max-height: 120px; border-radius: 6px; margin-bottom: 8px;">
          <br>
          <button id="btnGerarMemeComFoto" class="btn-acao" style="background: #00b09b;">✨ Gerar Vídeo Editado</button>
        </div>

        <div class="playlist-grid" id="playlistMemes">
          <div class="meme-card active-meme">
            <div class="badge-pessoas">Destaque</div>
            <video src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" style="width:100%; height:90px; object-fit:cover; border-radius:6px; background:#000;" controls preload="metadata"></video>
            <span style="font-size:11px; font-weight:bold; display:block; margin-top:4px;">Meme Viral #1</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
