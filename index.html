<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse AI</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="chat-container">
    <!-- HEADER -->
    <header class="chat-header">
      <div class="brand">
        <div class="logo-sparkle">✦</div>
        <div class="brand-info">
          <h1>Pulse AI</h1>
        </div>
      </div>
      <div class="header-actions">
        <div class="color-picker-box" title="Trocar Cor de Fundo">
          <input type="color" id="bg-color-picker" value="#ff003c">
        </div>
        <button class="action-btn" id="clear-btn">Limpar</button>
      </div>
    </header>

    <!-- CORPO DO CHAT -->
    <main class="chat-body tab-content active" id="chat-tab">
      <div class="message ai-message">
        <div class="bubble">
          Olá! Bem-vindo ao <b>Pulse AI</b>. Eu sou o seu assistente inteligente. Como posso te ajudar hoje?
        </div>
      </div>
    </main>

    <!-- ESTÚDIO DE MEMES E MIDIA -->
    <div class="tab-content visual-studio" id="studio-tab">
      <div class="memes-header-flex">
        <h2>Estúdio de Mídia & Memes</h2>
        <button class="main-btn" id="back-chat-btn">Voltar ao Chat</button>
      </div>

      <div class="import-panel-top">
        <div class="link-import-box">
          <input type="text" id="tiktok-url-input" placeholder="Cole aqui o link do TikTok / Reels...">
          <button class="main-btn" id="add-link-btn">Importar</button>
        </div>
        <label class="upload-playlist-btn">
          <span>+ Vídeo Local</span>
          <input type="file" id="video-file-input" accept="video/*" style="display:none;">
        </label>
        <label class="upload-playlist-btn foto-btn">
          <span>📷 Foto para Editar</span>
          <input type="file" id="foto-file-input" accept="image/*" style="display:none;">
        </label>
      </div>

      <!-- PRÉVIA DA FOTO -->
      <div class="foto-edicao-panel" id="foto-panel" style="display: none;">
        <div class="foto-preview-box">
          <img id="foto-preview-img" src="" alt="Foto para edição">
          <div>
            <span class="badge-status">Foto Carregada</span>
            <p style="font-size: 12px; color: #aaa; margin-top: 4px;">Envie instruções no chat para editar esta imagem com a IA.</p>
          </div>
        </div>
      </div>

      <div class="meme-grid" id="meme-grid-list" style="margin-top: 20px;">
        <!-- Lista de mídia gerada dinamicamente -->
      </div>
    </div>

    <!-- FOOTER E ENTRADA DE TEXTO -->
    <footer class="chat-footer">
      <div class="anexo-menu" id="anexo-menu">
        <button type="button" id="menu-studio-btn">🎬 Estúdio de Memes & Mídia</button>
        <label class="anexo-label-btn">
          📷 Carregar Foto para IA
          <input type="file" id="menu-foto-input" accept="image/*" style="display:none;">
        </label>
      </div>

      <div class="input-container">
        <button class="plus-btn" id="plus-btn" type="button">+</button>
        <textarea id="chat-input" rows="1" placeholder="Converse com a IA, peça orçamentos ou clique no +..."></textarea>
        <button class="send-btn" id="send-btn" type="button">➤</button>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
